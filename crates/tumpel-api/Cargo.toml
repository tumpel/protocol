[package]
name = "tumpel-api"
description = "Types and a typed client for the tumpel API and host channel, generated from its TypeSpec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["/Cargo.toml", "/README.md", "/src/**", "/generated/**"]

# The lib has no unit tests or benches. A test or bench build would compile the generated code
# a second time, in parallel with the lib build, and the two together exceed 4 GiB.
[lib]
test = false
bench = false

[dependencies]
chrono.workspace = true
progenitor-client.workspace = true
regress.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
http = "1.4.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "time"] }
